const MOCK_JOBS = [
  { id:1, title:"Senior Product Designer", company:"Figma", location:"San Francisco, CA", type:"Full-time", salary:"$140k–$180k", posted:"2 days ago", match:94 },
  { id:2, title:"UX Designer", company:"Airbnb", location:"Remote", type:"Full-time", salary:"$120k–$160k", posted:"1 day ago", match:88 },

];

async function callClaude(system, user, maxTokens=1500) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:maxTokens, system, messages:[{role:"user",content:user}] })
  });
  const d = await r.json();
  if (!d.content) throw new Error(JSON.stringify(d));
  return d.content[0].text;
}

async function parseResumeText(text) {
  const result = await callClaude(
    `Extract resume info. Return ONLY valid JSON with keys: name,email,phone,location,title,industry,summary,experience,skills,education.
experience = multi-line work history. skills = comma-separated. industry = inferred. Return ONLY the JSON, no fences.`,
    `Parse:\n\n${text.slice(0,5000)}`
  );
  return JSON.parse(result.replace(/```json|```/g,"").trim());
}

function PrintModal({ title, content, onClose }) {
  const [copied, setCopied] = useState(false);
  const doCopy = () => { navigator.clipboard.writeText(content); setCopied(true); setTimeout(()=>setCopied(false),2000); };
  useEffect(() => {
    const h = (e) => { if (e.key==="Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-toolbar">
          <div className="modal-toolbar-title">📄 {title}</div>
          <div className="modal-actions">
            <button className="modal-btn modal-btn-copy" onClick={doCopy}>{copied?"✓ Copied!":"Copy Text"}</button>
            <button className="modal-btn modal-btn-print" onClick={()=>window.print()}>🖨 Print / Save PDF</button>
            <button className="modal-btn modal-btn-close" onClick={onClose}>✕ Close</button>
          </div>
        </div>
        <div className="modal-content">{content}</div>
      </div>
    </div>
  );
}

  const addSkillTag = (e) => {
    if ((e.key==="Enter"||e.key===",") && skillInput.trim()) {
      e.preventDefault();
      const s = skillInput.trim().replace(/,$/,"");
      if (s && !skillTags.includes(s)) setSkillTags(t=>[...t,s]);
      setSkillInput("");
    }
  };

  const applyParsed = (parsed) => {
    setProfile({ name:parsed.name||"",email:parsed.email||"",phone:parsed.phone||"",location:parsed.location||"",
      title:parsed.title||"",industry:parsed.industry||"",summary:parsed.summary||"",
      experience:parsed.experience||"",skills:parsed.skills||"",education:parsed.education||"" });
    if (parsed.skills) setSkillTags(parsed.skills.split(",").map(s=>s.trim()).filter(Boolean).slice(0,15));
    setParseSuccess(true);
    setTimeout(()=>setParseSuccess(false),5000);
  };

  const handleFile = async (file) => {
    if (!file) return;
    setParsingResume(true); setParseSuccess(false);
    try {
      const fname = file.name.toLowerCase();
      if (file.type==="application/pdf" || fname.endsWith(".pdf")) {
        const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
        const response = await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1500,
            messages:[{role:"user",content:[
              {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
              {type:"text",text:`Extract all resume info. Return ONLY valid JSON:
{"name":"","email":"","phone":"","location":"","title":"","industry":"","summary":"","experience":"","skills":"","education":""}
experience=multi-line work history, skills=comma-separated, industry=inferred. ONLY the JSON, no fences.`}
            ]}]
          })
        });
        const data = await response.json();
        if (!data.content) throw new Error("no content");
        applyParsed(JSON.parse(data.content[0].text.replace(/```json|```/g,"").trim()));

      } else {

    } catch(err) {

    }
    setParsingResume(false);
  };

  const handlePaste = async () => {

  const handleSearch = async () => {

    setSearching(true); setSearchResults(null);
    try {
      const raw = await callClaude(
        `Generate realistic job listings. Return ONLY a JSON array of 6 objects:
[{"id":1,"title":"","company":"","location":"","type":"","salary":"","posted":"","match":0}]
- title: matches search query closely
- company: real well-known company
- location: real city or "Remote" (use location filter if given)
- type: "Full-time"|"Contract"|"Part-time" (use type filter if given)

Return ONLY the raw JSON array, no markdown.`,

      const skills = [...skillTags,...profile.skills.split(",").map(s=>s.trim()).filter(Boolean)].join(", ");
      const roleCtx = (targetJobTitle||targetCompany)
        ? `\n\nTARGET ROLE:\nTitle: ${targetJobTitle}\nCompany: ${targetCompany}\nDescription:\n${targetJobDesc||"(not provided)"}`
        : "";
      const result = await callClaude(
        `Expert resume writer. Create ATS-optimized resume in clean text with sections: CONTACT, SUMMARY, EXPERIENCE, SKILLS, EDUCATION.${targetJobTitle?" Mirror keywords and phrasing from the job description wherever truthfully applicable.":""}`,
        `${profile.name} | ${profile.title} | ${profile.email} | ${profile.phone} | ${profile.location}\nIndustry: ${profile.industry}\n\nSUMMARY:\n${profile.summary}\n\nEXPERIENCE:\n${profile.experience}\n\nSKILLS:\n${skills}\n\nEDUCATION:\n${profile.education}${roleCtx}`,
        2000
      );
      setResumeOutput(result);
    } catch(e) { setResumeOutput("Error generating. Check your API key and try again.\n\n" + e.message); }
    setGeneratingResume(false);
  };

  const generateCover = async () => {
    if (!profileFilled||!targetCompany||!targetJobTitle) return;
    setGeneratingCover(true); setCoverOutput("");
    try {
      const skills = [...skillTags,...profile.skills.split(",").map(s=>s.trim()).filter(Boolean)].join(", ");
      const result = await callClaude(
        "Expert career coach. Write a compelling, warm, personalized cover letter. No clichés. 3-4 paragraphs.",
        `${profile.name} → ${targetJobTitle} at ${targetCompany}\nBackground: ${profile.title}, ${profile.industry}\nExperience: ${profile.experience}\nSkills: ${skills}\nSummary: ${profile.summary}\nJob description: ${targetJobDesc||"(general)"}`,
        1200
      );
      setCoverOutput(result);
    } catch(e) { setCoverOutput("Error generating. Check your API key and try again."); }
    setGeneratingCover(false);
  };

  const updateApp = (id, updates) => setApplications(a=>a.map(x=>x.id===id?{...x,...updates}:x));
  const removeApp = (id) => setApplications(a=>a.filter(x=>x.id!==id));
  const addApp = () => {
    if (!newApp.title||!newApp.company) return;
    setApplications(a=>[...a,{...newApp,id:Date.now(),date:newApp.date||new Date().toISOString().split("T")[0]}]);
    setNewApp({title:"",company:"",date:"",status:"applied",notes:"",url:""});
  };

  const counts = STATUS_OPTIONS.reduce((acc,s)=>{acc[s]=applications.filter(a=>a.status===s).length;return acc;},{});

  return (
    <>
      <style>{STYLES}</style>
      {printDoc && <PrintModal title={printDoc.title} content={printDoc.content} onClose={()=>setPrintDoc(null)} />}
      <div className="app">
        <header className="header">
          <div className="logo">Job<span>Launchpad</span></div>
          <div className="tagline">AI-Powered Career Assistant</div>
        </header>
        {apiKeyMissing && (
          <div className="api-banner">
            ⚠ No API key set — open JobLaunchpad.html in a text editor and replace <strong>YOUR_API_KEY_HERE</strong> with your Anthropic API key to enable AI features.
          </div>
        )}
        <nav className="nav">
          {TABS.map(t=>(
            <button key={t} className={`nav-tab ${activeTab===t?"active":""}`} onClick={()=>setActiveTab(t)}>
              {t}
              {t==="Application Tracker" && applications.length>0 && <span className="badge">{applications.length}</span>}
            </button>
          ))}
        </nav>

        <main className="main">

          {activeTab==="Profile" && <>
            <div className="section-title">Your Profile</div>
            <p className="section-sub">Upload your resume to auto-fill, or fill in manually. Everything else is powered from here.</p>
            <div className="how-to">
              <div className="how-to-title">How it works</div>
              <div className="step-list">
                {[["Profile","Upload your resume or fill in manually — do this once."],
                  ["Job Search","Find roles, click titles to view on LinkedIn, save to track."],
                  ["Resume Builder","Enter target role + paste job description → get an ATS-tailored resume you can print."],
                  ["Cover Letter","Same target role info auto-carries over → one-click personalized letter, ready to print."],
                  ["Application Tracker","All saved jobs live here. Update status as you progress. Persists across sessions."]
                ].map(([t,d],i)=>(
                  <div key={i} className="step-item">
                    <div className="step-num">{i+1}</div>
                    <div className="step-text"><strong>{t}</strong> — {d}</div>
                  </div>
                ))}
              </div>
            </div>
            {parseSuccess && <div className="alert-yellow">✦ Resume parsed! Review and edit the fields below before generating documents.</div>}
            {profileFilled && !parseSuccess && <div className="alert-yellow">✦ Profile ready — go to Resume Builder to get started.</div>}
            <div className="card">
              <div className="card-title"><span className="dot" style={{background:"var(--accent2)"}}/>Upload Resume to Auto-Fill</div>
              <div className={`upload-zone ${dragover?"drag":""}`}
                onDragOver={e=>{e.preventDefault();setDragover(true);}}
                onDragLeave={()=>setDragover(false)}
                onDrop={e=>{e.preventDefault();setDragover(false);handleFile(e.dataTransfer.files[0]);}}
                onClick={()=>fileRef.current?.click()}>
                <input ref={fileRef} type="file" accept=".pdf,.txt" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
                <div className="upload-icon">{parsingResume?"⟳":"📄"}</div>
                <div className="upload-title">{parsingResume?"Parsing your resume…":"Drop resume here or click to upload"}</div>
                <div className="upload-sub">PDF or .txt · Drag & drop or click to browse</div>
                {parsingResume && <div className="loading-bar" style={{marginTop:14,maxWidth:300,margin:"14px auto 0"}}><div className="loading-bar-inner"/></div>}
              </div>
              <hr className="divider"/>
              <label>Or paste resume text here</label>
              <textarea rows={5} value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder="Copy and paste your full resume text, then click Parse…" style={{marginBottom:12}}/>
              <button className="btn btn-secondary" disabled={parsingResume||pasteText.length<30} onClick={handlePaste}>
                {parsingResume?"⟳ Parsing…":"✦ Parse & Auto-Fill Profile"}
              </button>
            </div>
            <div className="card">
              <div className="card-title"><span className="dot"/>Personal Info</div>
              <div className="grid-2">
                {[["name","Full Name","Alex Johnson"],["title","Professional Title","Senior Product Designer"],
                  ["email","Email","alex@email.com"],["phone","Phone","+1 (555) 000-0000"],
                  ["location","Location","San Francisco, CA"],["industry","Target Industry","Tech / SaaS / Design"]
                ].map(([k,l,p])=><div key={k}><label>{l}</label><input value={profile[k]} onChange={e=>up(k,e.target.value)} placeholder={p}/></div>)}
              </div>
            </div>
            <div className="card">
              <div className="card-title"><span className="dot" style={{background:"var(--accent2)"}}/>Professional Summary</div>
              <textarea rows={3} value={profile.summary} onChange={e=>up("summary",e.target.value)} placeholder="Results-driven professional with X years of experience…"/>
            </div>
            <div className="card">
              <div className="card-title"><span className="dot"/>Work Experience</div>
              <textarea rows={7} value={profile.experience} onChange={e=>up("experience",e.target.value)} placeholder={"Senior Designer @ Acme Corp (2022–Present)\n- Led redesign increasing engagement 34%\n\nUX Designer @ StartupXYZ (2019–2022)\n- Built onboarding flow reducing drop-off 28%"}/>
            </div>
            <div className="card">
              <div className="card-title"><span className="dot" style={{background:"#ff9f47"}}/>Skills</div>
              <label>Type a skill and press Enter</label>
              <input value={skillInput} onChange={e=>setSkillInput(e.target.value)} onKeyDown={addSkillTag} placeholder="Figma, React, User Research…"/>
              <div className="tags">
                {skillTags.map(s=><span key={s} className="tag">{s} <span className="tag-x" onClick={()=>setSkillTags(t=>t.filter(x=>x!==s))}>×</span></span>)}
              </div>
              <hr className="divider"/>
              <label>Or paste comma-separated</label>
              <input value={profile.skills} onChange={e=>up("skills",e.target.value)} placeholder="Figma, Sketch, HTML/CSS, React…"/>
            </div>
            <div className="card">
              <div className="card-title"><span className="dot" style={{background:"var(--accent2)"}}/>Education</div>
              <textarea rows={3} value={profile.education} onChange={e=>up("education",e.target.value)} placeholder={"B.S. Design, UC Berkeley (2019)\nMinor in Computer Science"}/>
            </div>
          </>}

          {activeTab==="Job Search" && <>
            <div className="section-title">Find Jobs</div>
            <p className="section-sub">Search for roles — click titles to view on LinkedIn, save to track them.</p>
            <div className="card">
              <div className="grid-3" style={{marginBottom:16}}>
                <div><label>Keywords</label><input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Product Designer…" onKeyDown={e=>e.key==="Enter"&&handleSearch()}/></div>
                <div><label>Location</label><input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Remote, NYC…" onKeyDown={e=>e.key==="Enter"&&handleSearch()}/></div>
                <div><label>Type</label>
                  <select value={searchType} onChange={e=>setSearchType(e.target.value)}>
                    <option value="all">All Types</option>
                    <option value="full-time">Full-time</option>
                    <option value="contract">Contract</option>
                    <option value="part-time">Part-time</option>
                  </select>
                </div>
              </div>
              <button className="btn btn-primary" onClick={handleSearch} disabled={searching||!searchQuery.trim()}>
                {searching?"Searching…":"⌕  Search Jobs"}
              </button>
              {searching && <div className="loading-bar"><div className="loading-bar-inner"/></div>}
            </div>
            {searchResults?.map(job=>{
              const linkedinUrl = `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(job.title+" "+job.company)}&location=${encodeURIComponent(job.location||"")}`;
              const alreadySaved = applications.some(a=>a.title===job.title&&a.company===job.company);
              return (
                <div key={job.id} className="job-card">
                  <div>
                    <div className="job-company">{job.company}</div>
                    <div className="job-title"><a href={linkedinUrl} target="_blank" rel="noopener noreferrer">{job.title} ↗</a></div>
                    <div className="job-meta">
                      <span>📍 {job.location}</span>
                      <span>💼 {job.type}</span>
                      <span className="hi">💰 {job.salary}</span>
                      <span>🕐 {job.posted}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:10}}>
                    <div className="match-pill">{job.match}% match</div>
                    {alreadySaved
                      ? <button className="btn btn-teal btn-sm" onClick={()=>setActiveTab("Application Tracker")}>✓ Saved — View →</button>
                      : <button className="btn btn-primary btn-sm" onClick={()=>saveJob(job,linkedinUrl)}>+ Save & Track</button>
                    }
                  </div>
                </div>
              );
            })}
            {!searchResults && (
              <div style={{textAlign:"center",padding:"60px 0",color:"var(--muted)"}}>
                <div style={{fontSize:48,marginBottom:16}}>⌕</div>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,marginBottom:8}}>Search to discover opportunities</div>
                <div style={{fontSize:13}}>Enter keywords above — titles link directly to LinkedIn</div>
              </div>
            )}
          </>}

          {activeTab==="Resume Builder" && <>
            <div className="section-title">Resume Builder</div>
            <p className="section-sub">Enter your target role, then generate a tailored ATS-optimized resume — ready to print or save as PDF.</p>
            {!profileFilled && <div className="alert-red">⚠ Fill out your Profile first — name, title, and experience are required.</div>}
            <div className="card">
              <div className="card-title"><span className="dot" style={{background:"var(--accent2)"}}/>Target Role <span style={{fontSize:12,fontWeight:400,color:"var(--muted)",marginLeft:6}}>— shared with Cover Letter</span></div>
              <div className="grid-2" style={{marginBottom:16}}>
                <div><label>Job Title</label><input value={targetJobTitle} onChange={e=>setTargetJobTitle(e.target.value)} placeholder="Senior Product Designer"/></div>
                <div><label>Company</label><input value={targetCompany} onChange={e=>setTargetCompany(e.target.value)} placeholder="Figma"/></div>
              </div>
              <label>Job Description <span style={{color:"var(--muted)",textTransform:"none",fontSize:11,letterSpacing:0}}>(paste for ATS keyword matching — highly recommended)</span></label>
              <textarea rows={5} value={targetJobDesc} onChange={e=>setTargetJobDesc(e.target.value)} placeholder="Paste the full job description here…"/>
            </div>
            <div className="card">
              <div className="card-title"><span className="dot"/>Generate Resume</div>
              <p style={{fontSize:13,color:"var(--muted)",marginBottom:20}}>
                {targetJobTitle ? `Tailoring for ${targetJobTitle}${targetCompany?" at "+targetCompany:""}` : "No target role set — will generate a general resume."}
              </p>
              <button className="btn btn-primary" onClick={generateResume} disabled={!profileFilled||generatingResume}>
                {generatingResume?"⟳  Generating…":"✦  Generate Resume"}
              </button>
              {generatingResume && <div className="loading-bar"><div className="loading-bar-inner"/></div>}
              {resumeOutput && <>
                <div style={{display:"flex",gap:10,marginTop:20,flexWrap:"wrap"}}>
                  <button className="btn btn-primary" onClick={()=>setPrintDoc({title:"Resume",content:resumeOutput})}>🖨 Print / Save PDF</button>
                  <button className="btn btn-secondary" onClick={()=>navigator.clipboard.writeText(resumeOutput)}>Copy Text</button>
                </div>
                <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:12,padding:24,marginTop:16,whiteSpace:"pre-wrap",fontSize:13,lineHeight:1.8,maxHeight:400,overflowY:"auto"}}>
                  {resumeOutput}
                </div>
              </>}
            </div>
          </>}

          {activeTab==="Cover Letter" && <>
            <div className="section-title">Cover Letter</div>
            <p className="section-sub">Uses the Target Role you set in Resume Builder — update it there and it applies here too.</p>
            {!profileFilled && <div className="alert-red">⚠ Fill out your Profile first.</div>}
            {(!targetJobTitle||!targetCompany)
              ? <div className="alert-yellow">
                  💡 Set your <strong style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setActiveTab("Resume Builder")}>Target Role in Resume Builder</strong> first.
                </div>
              : <div className="alert-teal">
                  <div>
                    <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Target Role</div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:16}}>{targetJobTitle} <span style={{color:"var(--muted)",fontWeight:400}}>at {targetCompany}</span></div>
                    {targetJobDesc && <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>{targetJobDesc.slice(0,120)}{targetJobDesc.length>120?"…":""}</div>}
                    <button className="btn btn-secondary btn-sm" style={{marginTop:10}} onClick={()=>setActiveTab("Resume Builder")}>Edit →</button>
                  </div>
                </div>
            }
            <div className="card">
              <div className="card-title"><span className="dot"/>Generate Cover Letter</div>
              <button className="btn btn-primary" onClick={generateCover} disabled={!profileFilled||!targetCompany||!targetJobTitle||generatingCover}>
                {generatingCover?"⟳  Writing…":"✦  Generate Cover Letter"}
              </button>
              {generatingCover && <div className="loading-bar"><div className="loading-bar-inner"/></div>}
              {coverOutput && <>
                <div style={{display:"flex",gap:10,marginTop:20,flexWrap:"wrap"}}>
                  <button className="btn btn-primary" onClick={()=>setPrintDoc({title:"Cover Letter",content:coverOutput})}>🖨 Print / Save PDF</button>
                  <button className="btn btn-secondary" onClick={()=>navigator.clipboard.writeText(coverOutput)}>Copy Text</button>
                </div>
                <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:12,padding:24,marginTop:16,whiteSpace:"pre-wrap",fontSize:13,lineHeight:1.8,maxHeight:400,overflowY:"auto"}}>
                  {coverOutput}
                </div>
              </>}
            </div>
          </>}

          {activeTab==="Application Tracker" && <>
            <div className="section-title">Application Tracker</div>
            <p className="section-sub">Saved jobs appear here automatically. Update statuses as you progress — everything persists between sessions.</p>
            <div className="stats-row">
              {[["Total",applications.length,"var(--accent)"],
                ...STATUS_OPTIONS.map(s=>[s.charAt(0).toUpperCase()+s.slice(1),counts[s],STATUS_COLORS[s]])
              ].map(([label,count,color])=>(
                <div key={label} className="stat-card">
                  <div className="stat-num" style={{color}}>{count}</div>
                  <div className="stat-label">{label}</div>
                </div>
              ))}
            </div>
            <div className="card">
              <div className="card-title"><span className="dot"/>Add Manually</div>
              <div className="quick-add">
                <div><label>Job Title</label><input value={newApp.title} onChange={e=>setNewApp(a=>({...a,title:e.target.value}))} placeholder="Product Designer" onKeyDown={e=>e.key==="Enter"&&addApp()}/></div>
                <div><label>Company</label><input value={newApp.company} onChange={e=>setNewApp(a=>({...a,company:e.target.value}))} placeholder="Stripe" onKeyDown={e=>e.key==="Enter"&&addApp()}/></div>
                <div style={{maxWidth:150}}><label>Status</label>
                  <select value={newApp.status} onChange={e=>setNewApp(a=>({...a,status:e.target.value}))}>
                    {STATUS_OPTIONS.map(s=><option key={s} value={s}>{s.charAt(0).toUpperCase()+s.slice(1)}</option>)}
                  </select>
                </div>
                <div style={{maxWidth:170}}><label>Date</label><input type="date" value={newApp.date} onChange={e=>setNewApp(a=>({...a,date:e.target.value}))}/></div>
                <div style={{paddingTop:22}}><button className="btn btn-primary" onClick={addApp} disabled={!newApp.title||!newApp.company}>+ Add</button></div>
              </div>
            </div>
            {applications.length > 0 ? (
              <div className="card" style={{padding:0,overflow:"hidden"}}>
                <table className="tracker-table">
                  <thead>
                    <tr><th>Role</th><th>Company</th><th>Date</th><th>Status</th><th>Notes</th><th></th></tr>
                  </thead>
                  <tbody>
                    {applications.map(app=>(
                      <tr key={app.id}>
                        <td style={{fontWeight:600}}>
                          {app.url
                            ? <a href={app.url} target="_blank" rel="noopener noreferrer" style={{color:"var(--text)",textDecoration:"none"}}
                                onMouseEnter={e=>e.currentTarget.style.color="var(--accent)"}
                                onMouseLeave={e=>e.currentTarget.style.color="var(--text)"}>{app.title} ↗</a>
                            : app.title}
                        </td>
                        <td style={{color:"var(--muted)"}}>{app.company}</td>
                        <td style={{color:"var(--muted)",fontSize:12,whiteSpace:"nowrap"}}>{app.date||"—"}</td>
                        <td>
                          <select className="status-select" value={app.status}
                            onChange={e=>updateApp(app.id,{status:e.target.value})}
                            style={{color:STATUS_COLORS[app.status]||"var(--text)"}}>
                            {STATUS_OPTIONS.map(s=><option key={s} value={s}>{s.charAt(0).toUpperCase()+s.slice(1)}</option>)}
                          </select>
                        </td>
                        <td><input className="notes-input" value={app.notes||""} onChange={e=>updateApp(app.id,{notes:e.target.value})} placeholder="Add notes…"/></td>
                        <td><button className="btn btn-danger" onClick={()=>removeApp(app.id)}>✕</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div style={{textAlign:"center",padding:"48px 0",color:"var(--muted)"}}>
                <div style={{fontSize:36,marginBottom:12}}>📋</div>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,marginBottom:6}}>No applications yet</div>
                <div style={{fontSize:13}}>Save jobs from Job Search, or add them manually above</div>
              </div>
            )}
          </>}

        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
