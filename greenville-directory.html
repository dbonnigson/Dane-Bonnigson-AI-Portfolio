<html lang="en">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --panel:#1a2420; --panel2:#212e28; --panel3:#273530;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.13);
  --rust:#c4622d; --rust-g:rgba(196,98,45,.3);
  --gold:#c9943a; --sage:#5c8a6a; --cream:#f4f0e8; --white:#fff;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Outfit,sans-serif}

#map{position:fixed;inset:0;z-index:0}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:56px;background:var(--panel);
  display:flex;align-items:center;gap:14px;padding:0 18px;
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 20px rgba(0,0,0,.4);
}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-badge{width:30px;height:30px;background:var(--rust);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 14px var(--rust-g)}
.logo-text{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;color:var(--cream)}
.logo-text em{color:var(--gold);font-style:italic}
.sw{flex:1;max-width:420px;position:relative}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(244,240,232,.28);pointer-events:none}
.sw input{width:100%;padding:8px 14px 8px 36px;background:rgba(255,255,255,.07);border:1px solid var(--border2);border-radius:8px;color:var(--cream);font-family:Outfit,sans-serif;font-size:13px;outline:none;transition:all .2s}
.sw input::placeholder{color:rgba(244,240,232,.28)}
.sw input:focus{background:rgba(255,255,255,.11);border-color:rgba(196,98,45,.55)}
.sp{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:8px;overflow:hidden;flex-shrink:0;margin-left:auto}
.sb{padding:6px 14px;border:none;background:transparent;color:rgba(244,240,232,.45);font-family:Outfit,sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.sb.active{background:var(--rust);color:var(--white);box-shadow:0 0 14px var(--rust-g)}

.panel{
  position:fixed;top:56px;left:0;bottom:0;z-index:50;
  width:330px;background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  box-shadow:4px 0 32px rgba(0,0,0,.35);
  overflow:hidden;
}
.stats{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:var(--panel2);border-bottom:1px solid var(--border);flex-shrink:0}
.stat-ct{font-size:11.5px;color:rgba(244,240,232,.4)}
.stat-ct strong{color:var(--cream);font-weight:600}
.stat-mode{font-size:10px;color:rgba(244,240,232,.25);text-transform:uppercase;letter-spacing:.5px}

.cat-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.07) transparent}
.cat-list::-webkit-scrollbar{width:3px}
.cat-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:2px}

.cat-sec{border-bottom:1px solid var(--border)}

/* Photo header toggle */
.cat-hdr{
  position:relative;cursor:pointer;overflow:hidden;
  height:76px;display:flex;align-items:flex-end;
  transition:height .25s var(--ease);
}
.cat-hdr.open{height:84px}
.cat-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:brightness(.38) saturate(.75);
  transition:filter .3s;
}
.cat-hdr:hover .cat-bg{filter:brightness(.48) saturate(.85)}
.cat-hdr.open .cat-bg{filter:brightness(.3) saturate(.65)}
.cat-inner{position:relative;z-index:1;padding:12px 14px;width:100%;display:flex;align-items:center;justify-content:space-between}
.cat-lbl{display:flex;align-items:center;gap:8px}
.cat-em{font-size:16px}
.cat-nm{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600;color:var(--cream);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.cat-ct{font-size:10.5px;color:rgba(244,240,232,.5);margin-left:3px}
.chev{width:18px;height:18px;color:rgba(244,240,232,.45);transition:transform .25s var(--ease),color .2s;flex-shrink:0}
.cat-hdr.open .chev{transform:rotate(180deg);color:var(--gold)}

/* Dropdown */
.cat-cards{max-height:0;overflow:hidden;transition:max-height .38s var(--ease);background:var(--panel2)}
.cat-cards.open{max-height:580px;overflow-y:auto}
.cat-cards::-webkit-scrollbar{width:3px}
.cat-cards::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.cards-in{padding:8px;display:flex;flex-direction:column;gap:6px}

/* Biz card */
.biz{background:var(--panel3);border:1px solid var(--border);border-radius:9px;padding:11px;cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
.biz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
.biz:hover{border-color:rgba(255,255,255,.14);transform:translateX(2px)}
.biz.active{border-color:var(--rust)}
.biz.active::before{background:var(--rust)}
.biz-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.biz-nm{font-family:"Cormorant Garamond",serif;font-size:14px;font-weight:600;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz-stars{display:flex;align-items:center;gap:3px;flex-shrink:0}
.stars{display:flex;gap:1px}
.star{font-size:9px;color:var(--gold)}
.star.empty{color:rgba(201,148,58,.2)}
.star.half{opacity:.5}
.r-n{font-size:11px;font-weight:600;color:var(--cream)}
.biz-sub{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:5px}
.biz-desc{font-size:11px;color:rgba(244,240,232,.38);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.biz-foot{display:flex;align-items:center;justify-content:space-between}
.biz-addr{font-size:10px;color:rgba(244,240,232,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz-dist{font-size:10.5px;font-weight:600;color:var(--rust);background:rgba(196,98,45,.13);padding:2px 7px;border-radius:4px;flex-shrink:0}

.cat-empty{padding:16px;text-align:center;color:rgba(244,240,232,.22);font-size:11.5px}

/* Toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;background:var(--panel);color:var(--cream);border:1px solid var(--border2);padding:8px 18px;border-radius:26px;font-size:12px;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,.45);white-space:nowrap;transition:opacity .4s,transform .4s}
.toast.hidden{opacity:0;transform:translateX(-50%) translateY(8px);pointer-events:none}

/* Leaflet */
.leaflet-popup-content-wrapper{border-radius:10px !important;box-shadow:0 8px 40px rgba(0,0,0,.35) !important;padding:0 !important;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.leaflet-popup-content{margin:0 !important;width:225px !important}
.leaflet-popup-tip-container{display:none}
.pu{background:#fff;padding:13px}
.pu-name{font-family:"Cormorant Garamond",serif;font-size:15px;font-weight:700;color:#1a2420;margin-bottom:2px}
.pu-cat{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;color:var(--rust);margin-bottom:7px}
.pu-row{font-size:11.5px;color:#3a443f;margin-bottom:4px}
.pu-hrs{font-size:10px;color:#6b7870;margin-top:2px}
.pu-dist{margin-top:7px;display:inline-block;background:var(--rust);color:white;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600}

.m-dot{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s}
.m-dot.big{transform:scale(1.7)}
.user-dot{width:14px;height:14px;background:var(--rust);border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px var(--rust-g),0 3px 12px rgba(0,0,0,.4);animation:throb 2s infinite;cursor:grab}
@keyframes throb{0%,100%{box-shadow:0 0 0 3px var(--rust-g),0 3px 12px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 8px rgba(196,98,45,.08),0 3px 12px rgba(0,0,0,.4)}}

@media(max-width:700px){
  .panel{width:100%;top:auto;height:52vh;border-right:none;border-top:1px solid var(--border)}
  #map{bottom:52vh}
  .sp{display:none}
  .sw{max-width:none}
}
</style>
</head>

  {id:50,name:"Hampton III Gallery",cat:"arts",sub:"Art Gallery",addr:"3110 Wade Hampton Blvd",lat:34.9012,lng:-82.3312,r:4.6,rc:145,desc:"Premier regional art gallery featuring established and emerging artists in all mediums.",ph:"(864) 268-2771",hrs:"Tue-Sat 10am-5pm"}

const COL={restaurants:"#c4622d",fitness:"#5c8a6a",recreation:"#3d7a8a",services:"#c9943a",shopping:"#8a6a3d",arts:"#7a5c8a"};
let map,uM,mkrs={};
let uLat=34.8526,uLng=-82.3940;
let sMode="proximity",q="",aId=null,openCat=null;

function dist(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function fmt(n){return n>=1000?(n/1000).toFixed(1)+"k":n}
function stH(r){let h="<div class='stars'>";for(let i=1;i<=5;i++){h+=r>=i?"<span class='star'>&#9733;</span>":r>=i-.5?"<span class='star half'>&#9733;</span>":"<span class='star empty'>&#9733;</span>";}return h+"</div>"}
function pu(b){const d=dist(uLat,uLng,b.lat,b.lng);return"<div class='pu'><div class='pu-name'>"+b.name+"</div><div class='pu-cat'>"+b.sub+"</div><div class='pu-row'>"+stH(b.r)+" "+b.r+" ("+fmt(b.rc)+" reviews)</div><div class='pu-row'>&#128205; "+b.addr+"</div><div class='pu-row'>&#128222; "+b.ph+"</div><div class='pu-hrs'>&#x1F550; "+b.hrs+"</div><div class='pu-dist'>"+d.toFixed(1)+" mi away</div></div>"}

function initMap(){
  map=L.map("map",{center:[34.8526,-82.3940],zoom:13,zoomControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; <a href='https://openstreetmap.org/copyright'>OpenStreetMap</a>",maxZoom:19}).addTo(map);
  L.control.zoom({position:"bottomright"}).addTo(map);
  uM=L.marker([uLat,uLng],{draggable:true,icon:L.divIcon({className:"",html:"<div class='user-dot'></div>",iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:1000}).addTo(map);
  uM.bindPopup("<div class='pu'><div class='pu-name'>&#128205; You Are Here</div><div class='pu-hrs'>Drag to reposition. Distances update automatically.</div></div>");
  uM.on("dragend",e=>{const p=e.target.getLatLng();uLat=p.lat;uLng=p.lng;BIZ.forEach(b=>{if(mkrs[b.id])mkrs[b.id].setPopupContent(pu(b))});renderAll();toast("&#10003; Location updated")});
  BIZ.forEach(b=>{
    const col=COL[b.cat]||"#5c8a6a";
    const m=L.marker([b.lat,b.lng],{icon:L.divIcon({className:"",html:"<div class='m-dot' style='background:"+col+"'></div>",iconSize:[11,11],iconAnchor:[5,5]}),title:b.name}).addTo(map).bindPopup(pu(b));
    m.on("click",()=>{setAct(b.id);openCatFn(b.cat);sToBiz(b.id)});
    mkrs[b.id]=m;
  });
  setTimeout(()=>document.getElementById("toast").classList.add("hidden"),4000);
}

function setSort(mode){
  sMode=mode;
  document.getElementById("btnP").classList.toggle("active",mode==="proximity");
  document.getElementById("btnR").classList.toggle("active",mode==="rating");
  document.getElementById("smode").textContent=mode==="proximity"?"By proximity":"By rating";
  renderAll();
}

function getFilt(catId){
  let list=BIZ.filter(b=>b.cat===catId);
  if(q)list=list.filter(b=>b.name.toLowerCase().includes(q)||b.sub.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q));
  list=list.map(b=>({...b,d:dist(uLat,uLng,b.lat,b.lng)}));
  if(sMode==="proximity")list.sort((a,b)=>a.d-b.d);
  else list.sort((a,b)=>(b.r*Math.log(b.rc+1))-(a.r*Math.log(a.rc+1)));
  return list;
}

function renderAll(){
  let tot=0;
  CATS.forEach(cat=>{
    const items=getFilt(cat.id);
    tot+=items.length;
    const sec=document.getElementById("sec-"+cat.id);if(!sec)return;
    const inner=sec.querySelector(".cards-in");
    const ct=sec.querySelector(".cat-ct");
    if(ct)ct.textContent="("+items.length+")";
    inner.innerHTML=items.length===0
      ?"<div class='cat-empty'>No results in this category</div>"
      :items.map(b=>"<div class='biz"+(b.id===aId?" active":"")+"' id='biz-"+b.id+"' onclick='bizClick("+b.id+")'><div class='biz-top'><div class='biz-nm'>"+b.name+"</div><div class='biz-stars'>"+stH(b.r)+"<span class='r-n'>"+b.r+"</span></div></div><div class='biz-sub'>"+b.sub+"</div><div class='biz-desc'>"+b.desc+"</div><div class='biz-foot'><div class='biz-addr'>&#128205; "+b.addr+"</div><span class='biz-dist'>"+b.d.toFixed(1)+" mi</span></div></div>").join("");
  });
  document.getElementById("ttl").textContent=q?tot:"50";
}

function buildHTML(){
  document.getElementById("catList").innerHTML=CATS.map(cat=>`
    <div class="cat-sec" id="sec-${cat.id}">
      <div class="cat-hdr" onclick="togCat('${cat.id}')">
        <div class="cat-bg" style="background-image:url('${cat.photo}')"></div>
        <div class="cat-inner">
          <div class="cat-lbl">
            <span class="cat-em">${cat.em}</span>
            <span class="cat-nm">${cat.name}</span>
            <span class="cat-ct">(${BIZ.filter(b=>b.cat===cat.id).length})</span>
          </div>
          <svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="cat-cards" id="cc-${cat.id}">
        <div class="cards-in"></div>
      </div>
    </div>`).join("");
  renderAll();
}

function togCat(id){
  const hdr=document.querySelector("#sec-"+id+" .cat-hdr");
  const cc=document.getElementById("cc-"+id);
  const wasOpen=cc.classList.contains("open");
  CATS.forEach(c=>{document.querySelector("#sec-"+c.id+" .cat-hdr").classList.remove("open");document.getElementById("cc-"+c.id).classList.remove("open")});
  if(!wasOpen){
    hdr.classList.add("open");cc.classList.add("open");openCat=id;
    BIZ.forEach(b=>{if(mkrs[b.id])mkrs[b.id].setOpacity(b.cat===id?1:.18)});
  } else {
    openCat=null;
    BIZ.forEach(b=>{if(mkrs[b.id])mkrs[b.id].setOpacity(1)});
  }
}

function openCatFn(id){if(!document.getElementById("cc-"+id).classList.contains("open"))togCat(id)}

function bizClick(id){
  setAct(id);
  const b=BIZ.find(x=>x.id===id);
  if(b){map.flyTo([b.lat,b.lng],15,{duration:0.8});setTimeout(()=>mkrs[id]?.openPopup(),900)}
}

function setAct(id){
  if(aId){document.getElementById("biz-"+aId)?.classList.remove("active");mkrs[aId]?._icon?.querySelector(".m-dot")?.classList.remove("big")}
  aId=id;
  document.getElementById("biz-"+id)?.classList.add("active");
  mkrs[id]?._icon?.querySelector(".m-dot")?.classList.add("big");
}

function sToBiz(id){setTimeout(()=>document.getElementById("biz-"+id)?.scrollIntoView({behavior:"smooth",block:"nearest"}),380)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2800)}

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("srch").addEventListener("input",e=>{
    q=e.target.value.toLowerCase().trim();
    renderAll();
    if(q)CATS.forEach(c=>{if(getFilt(c.id).length>0)openCatFn(c.id)});
  });
  initMap();
  buildHTML();
  toast("&#128205; Drag the orange pin to update your location");
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{uLat=p.coords.latitude;uLng=p.coords.longitude;uM.setLatLng([uLat,uLng]);map.flyTo([uLat,uLng],13,{duration:1});renderAll();toast("Using your real location!")},()=>{});
});
</script>
</body>
</html>
